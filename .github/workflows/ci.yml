name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sdk:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18.18.2, 20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ts-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keyzori/types
          ref: ee05fe6d13255e5b8765fe01bcdaeb54b33b462b # @keyzori/types 0.1.0
          path: types
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
        working-directory: types
      - run: bun pm pack --destination .artifacts && bun link
        working-directory: types
      - run: bun install --frozen-lockfile
        working-directory: ts-sdk
      - run: bun run check
        working-directory: ts-sdk
      - run: bun run audit
        working-directory: ts-sdk
  integration:
    name: Server contracts and live Node SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: keyzori-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KEYZORI_TEST_DATABASE_URL: postgresql://postgres:keyzori-ci-only@127.0.0.1:5432/postgres
      KEYZORI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ts-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keyzori/types
          ref: ee05fe6d13255e5b8765fe01bcdaeb54b33b462b # @keyzori/types 0.1.0
          path: types
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keyzori/Keyzori
          ref: 79990a2c7dcaa4e41fc9897874dd144fc35fe3a8
          path: server
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        working-directory: types
      - run: bun pm pack --destination .artifacts && bun link
        working-directory: types
      - run: bun install --frozen-lockfile
        working-directory: ts-sdk
      - run: bun run setup
        working-directory: server
      - run: bun run build && bun run test:contract && bun run test:live
        working-directory: ts-sdk
      - run: bun run test:contract
        working-directory: types
      - run: bun run test:coverage
        working-directory: ts-sdk
  server:
    name: Complete server verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: keyzori-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      KEYZORI_TEST_DATABASE_URL: postgresql://postgres:keyzori-ci-only@127.0.0.1:5432/postgres
      KEYZORI_TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ts-sdk
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keyzori/types
          ref: ee05fe6d13255e5b8765fe01bcdaeb54b33b462b # @keyzori/types 0.1.0
          path: types
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: keyzori/Keyzori
          ref: 79990a2c7dcaa4e41fc9897874dd144fc35fe3a8
          path: server
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - run: bun run setup
        working-directory: server
      - name: Types, lint, migrations, release metadata, and all test suites
        working-directory: server
        run: |
          bun run typecheck
          bun run lint
          bun run db:check
          bun run release:verify
          bun run test:coverage
      - name: Validate Compose
        working-directory: server
        run: docker compose config --quiet
        env:
          KEYZORI_ADMIN_KEY: ci-only-key-with-at-least-32-characters
          KEYZORI_POSTGRES_PASSWORD: ci-only-password
      - name: Build and test SDK identity across replacement containers
        run: |
          cd types
          bun install --frozen-lockfile
          bun pm pack --destination .artifacts
          bun link
          cd ../ts-sdk
          bun install --frozen-lockfile
          bun run build
          bun run test:docker
      - name: Build and smoke-test server distribution
        working-directory: server
        run: bun run docker:build && bun run docker:smoke
  workflows:
    name: Workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: docker run --rm --volume "$PWD:/repo:ro" --workdir /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
  required:
    name: Required checks
    if: ${{ always() }}
    needs: [sdk, integration, server, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
